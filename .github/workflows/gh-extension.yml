# Builds standalone binaries of the CLI and attaches them to the GitHub release, so it can be
# installed as a precompiled GitHub CLI extension: `gh extension install dsoftwareinc/gh-actions-update`.
# gh picks the release asset named `gh-actions-update-<os>-<arch>[.exe]` matching the user's platform.

name: Release gh extension binaries

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: gh-actions-update-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: gh-actions-update-linux-arm64
          - runner: macos-15-intel
            asset: gh-actions-update-darwin-amd64
          - runner: macos-latest
            asset: gh-actions-update-darwin-arm64
          - runner: windows-latest
            asset: gh-actions-update-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --clean --noconfirm --name gh-actions-update --paths . gha_cli/__main__.py

      - name: Smoke test
        shell: bash
        run: ./dist/gh-actions-update* --help

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          src=dist/gh-actions-update
          [[ "$RUNNER_OS" == "Windows" ]] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
