# Builds the binaries of the extension and attaches them to the GitHub release, so it can be installed as a
# precompiled GitHub CLI extension: `gh extension install dsoftwareinc/gh-actions-update`.
# gh picks the release asset named `gh-actions-update-<os>-<arch>[.exe]` matching the user's platform.

name: Release gh extension binaries

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        run: |
          platforms=(
            darwin/amd64 darwin/arm64
            freebsd/amd64 freebsd/arm64
            linux/386 linux/amd64 linux/arm linux/arm64
            windows/386 windows/amd64 windows/arm64
          )
          for platform in "${platforms[@]}"; do
            goos=${platform%/*} goarch=${platform#*/}
            ext=""
            [[ $goos == windows ]] && ext=".exe"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w -X main.version=$TAG" \
              -o "dist/gh-actions-update-$goos-$goarch$ext" .
          done

      - name: Smoke test
        run: ./dist/gh-actions-update-linux-amd64 --version

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
